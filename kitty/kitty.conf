color14 #8BE4F0
color15 #F0F1FA

# SPLIT BORDERS
active_border_color   #A78BFA
inactive_border_color #252B40

# TABS
active_tab_foreground   #F0F1FA
active_tab_background   #252B40
inactive_tab_foreground #858BA5
inactive_tab_background #151827

# ─────────────────────────────
# DIVERS
# ─────────────────────────────

enable_audio_bell no
