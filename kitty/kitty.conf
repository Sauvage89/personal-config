# ─────────────────────────────
# SPLITS
# ─────────────────────────────

allow_remote_control yes

enabled_layouts splits, stack

active_border_color   #89b4fa
inactive_border_color #0b1020

window_border_width 1pt

# Split horizontal vertical
map ctrl+shift+o launch --location=hsplit --cwd=current
map ctrl+shift+e launch --location=vsplit --cwd=current

# Resize des splits entre eux
map ctrl+shift+left  resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+down   resize_window taller
map ctrl+shift+up resize_window shorter

# Navigation entre les splits
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# Fermer le split actuel
map ctrl+shift+w close_window

# Zoom dans un split
map ctrl+shift+z toggle_layout stack

# ─────────────────────────────
# FONT
# ─────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0
disable_ligatures always

# ─────────────────────────────
# WINDOW
# ─────────────────────────────

window_padding_width 5
window_margin_width 5
hide_window_decorations yes

# ─────────────────────────────
# TABS
# ─────────────────────────────

tab_bar_edge top
tab_bar_style powerline

active_tab_foreground   #ffffff
active_tab_background   #3b4252

inactive_tab_foreground #888888
inactive_tab_background #1e1e1e

# ─────────────────────────────
# COLORS — ABYSSAL VIOLET
# ─────────────────────────────

foreground              #D6D9E8
background              #0B0D17

selection_foreground    #0B0D17
selection_background    #67D5E8

cursor                  #A78BFA
cursor_text_color       #0B0D17

# ANSI
